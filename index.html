<style>
/* Layout: one column workbench — app bar, step rail, form sheet, sticky step nav. */
:root{
  --paper:#F3F5F1; --surface:#FFFFFF; --sunk:#E9EDE7; --ink:#15302E; --muted:#5B6A64; --line:#D7DED6;
  --brand:#14302F; --brand-ink:#F3F5F1; --accent:#B97A14; --accent-soft:#F6EBD6; --good:#2E7A4E; --warn:#A8661A; --bad:#B23B2E;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1514; --surface:#162120; --sunk:#1D2a28; --ink:#E5EDE9; --muted:#97A7A1; --line:#2B3936;
  --brand:#0A1211; --brand-ink:#E5EDE9; --accent:#E2A642; --accent-soft:#3A2E17; --good:#5DBA85; --warn:#E0A050; --bad:#E07062; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1514; --surface:#162120; --sunk:#1D2a28; --ink:#E5EDE9; --muted:#97A7A1; --line:#2B3936;
  --brand:#0A1211; --brand-ink:#E5EDE9; --accent:#E2A642; --accent-soft:#3A2E17; --good:#5DBA85; --warn:#E0A050; --bad:#E07062; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--brand);color:var(--brand-ink)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:0;padding:0;text-align:left;color:inherit}
.mark{width:34px;height:34px;flex:none;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:20px;height:20px}
.brand b{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.2px;display:block;line-height:1.1}
.brand small{display:block;font-size:11.5px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;border:1px solid color-mix(in srgb,var(--brand-ink) 35%,transparent);border-radius:999px;overflow:hidden;flex:none}
.seg button{background:none;border:0;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--brand-ink);opacity:.75}
.seg button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand);opacity:1}
.iconbtn{background:none;border:1px solid color-mix(in srgb,var(--brand-ink) 35%,transparent);color:var(--brand-ink);border-radius:999px;width:32px;height:32px;display:grid;place-items:center;flex:none}

/* home */
.hero{padding-block:26px 8px}
.hero h1{font-family:var(--display);font-size:clamp(26px,6vw,36px);line-height:1.08;margin:0 0 10px;text-wrap:balance;letter-spacing:-.3px}
.hero p{margin:0;color:var(--muted);max-width:56ch}
.actions{display:flex;flex-wrap:wrap;gap:10px;padding-block:18px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:10px 16px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1B1305}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13.5px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:progress}
.list{display:grid;gap:10px;padding-block:8px 40px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.pthumb{width:52px;height:52px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;color:#fff;overflow:hidden;background:var(--brand)}
.pthumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.pmeta{min-width:0}
.pmeta h3{margin:0;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.pmeta p{margin:2px 0 8px;color:var(--muted);font-size:13px}
.meter{height:5px;background:var(--sunk);border-radius:9px;overflow:hidden;margin-bottom:10px}
.meter i{display:block;height:100%;background:var(--good)}
.prow{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--warn);vertical-align:2px;margin-left:6px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.foot{color:var(--muted);font-size:12.5px;padding-block:8px 32px}

/* editor */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:8;background:var(--paper);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.rail .wrap::-webkit-scrollbar{display:none}
.step{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.step.done .n{background:var(--good);color:#fff}
.step[aria-current="step"]{border-color:var(--ink);color:var(--ink)}
.step[aria-current="step"] .n{background:var(--ink);color:var(--paper)}
.sheet{padding-block:22px 120px}
.sheet h2{font-family:var(--display);font-size:24px;margin:0 0 4px;letter-spacing:-.2px;text-wrap:balance}
.sheet .sub{margin:0 0 20px;color:var(--muted);font-size:14px}
.sheet .bizname{color:var(--muted);font-size:13px;font-weight:600;margin:0 0 6px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.full{grid-column:1/-1}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:13.5px}
.field label em{font-style:normal;color:var(--warn);font-weight:500;font-size:12px;margin-left:4px}
.field .hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 11px;min-height:44px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
textarea.tall{min-height:170px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.notice{border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--accent-soft);color:var(--ink);margin-bottom:14px}
.notice.good{background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.repeat{display:grid;gap:12px}
.item{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px}
.item .ihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.item .ihead b{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;color:var(--bad);font-weight:600;font-size:13px;padding:4px}
.section-title{font-family:var(--display);font-size:17px;margin:26px 0 4px}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.mtile{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.mtile .ph{aspect-ratio:4/3;max-width:100%;background:var(--sunk);position:relative;overflow:hidden}
.mtile .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mtile.cert .ph{aspect-ratio:3/4}
.mtile.cert .ph img{object-fit:contain;background:#fff}
.mtile input{border:0;border-top:1px solid var(--line);border-radius:0;min-height:38px;font-size:13px}
.mtile .linkbtn{align-self:flex-end;padding:6px 10px}
.logo-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-box{width:96px;height:96px;border-radius:12px;border:1px dashed var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;color:#8A949C;font-size:12px}
.logo-box img{width:100%;height:100%;object-fit:contain}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.navbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navbar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.navbar .status{flex:1;text-align:center;font-size:12.5px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* export */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin:10px 0 6px}
.theme{border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px;text-align:left;font-weight:600;font-size:13px}
.theme[aria-pressed="true"]{border-color:var(--ink)}
.swatch{display:flex;height:34px;border-radius:6px;overflow:hidden;margin-bottom:6px}
.swatch i{flex:3}.swatch i+i{flex:1}
.check{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.check li{display:flex;gap:10px;align-items:center;font-size:14px}
.check .dot{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;color:#fff;background:var(--good)}
.check li.miss .dot{background:transparent;border:2px solid var(--warn)}
.check li.miss button{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:14px;text-align:left}
.exbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.preview{margin-top:12px;background:var(--sunk);border-radius:var(--r);padding:16px;display:grid;gap:14px;justify-items:center}
.paper{width:100%;max-width:440px;background:#fff;color:#1F2A33;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08);aspect-ratio:210/297;overflow:hidden;position:relative;font-size:9px;line-height:1.45}
.paper.cover .band{position:absolute;inset:0 0 36% 0;padding:9% 9%;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.paper.cover .band .lg{width:22%;aspect-ratio:1;background:#fff;border-radius:6px;padding:3%;margin-bottom:auto}
.paper.cover .band .lg img{width:100%;height:100%;object-fit:contain}
.paper.cover .kick{font-weight:700;letter-spacing:2px;font-size:8px}
.paper.cover .nm{font-size:22px;font-weight:700;line-height:1.1;margin:6px 0;overflow-wrap:anywhere}
.paper.cover .tg{font-style:italic;font-size:10px}
.paper.cover .low{position:absolute;left:9%;right:9%;bottom:8%;color:#4A5560}
.paper.cover .low b{color:#1F2A33}
.paper.page{padding:8% 8% 10%}
.paper.page h4{margin:0 0 6px;font-size:12px;padding-bottom:3px;border-bottom:1.5px solid}
.paper.page table{width:100%;border-collapse:collapse;margin-bottom:10px}
.paper.page td{border:1px solid #D5D9DD;padding:2px 5px;vertical-align:top}
.paper.page td:first-child{font-weight:700;width:36%}
.paper.page p{margin:0 0 6px}
.paper .pf{position:absolute;left:8%;right:8%;bottom:4%;border-top:1px solid;padding-top:3px;display:flex;justify-content:space-between;color:#6B7680;font-size:7px}
.small{font-size:12.5px;color:var(--muted)}

/* dialog + toast */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,12,11,.5);display:grid;place-items:end center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.scrim{place-items:center}}
.dialog{background:var(--surface);border-radius:14px;max-width:520px;width:100%;padding:22px;max-height:88%;overflow:auto}
.dialog h3{font-family:var(--display);font-size:21px;margin:0 0 8px}
.dialog h4{margin:18px 0 4px;font-size:15px}
.dialog p{margin:0 0 8px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:rise .22s ease-out}@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<script>/* RDC Profile Builder — document generators (Word + PDF).
   Shared by the app (browser) and the Node test harness. */
var PB_THEMES = {
  ocean:    { name: "Ocean",    primary: "0E4D64", accent: "F2A541", dark: "0A3242", light: "EAF2F5" },
  cocoa:    { name: "Cocoa",    primary: "5A3825", accent: "D9A441", dark: "3B2416", light: "F5EEE6" },
  garden:   { name: "Garden",   primary: "2F6B3A", accent: "E0B23A", dark: "1F4527", light: "ECF4ED" },
  sunset:   { name: "Sunset",   primary: "8E2C2C", accent: "F0B44C", dark: "5E1C1C", light: "F8EDEA" },
  charcoal: { name: "Charcoal", primary: "2B2D33", accent: "D2453B", dark: "17181B", light: "F0F0F2" }
};

var PB_ENTITY = {
  sole: "Sole Trader", partnership: "Partnership", company: "Company (Limited)",
  association: "Incorporated Association", cooperative: "Cooperative Society", other: "Other"
};
var PB_GST = { no: "Not registered for GST", yes: "Registered for GST" };

function pbTrim(v) { return (v == null ? "" : String(v)).trim(); }
function pbLines(v) { return pbTrim(v).split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean); }
function pbHasImg(i) { return i && i.data && i.w && i.h; }
function pbB64ToBytes(dataUrl) {
  var b64 = dataUrl.split(",")[1] || "";
  if (typeof atob === "function") {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  return new Uint8Array(Buffer.from(b64, "base64"));
}
function pbImgType(dataUrl) { return /^data:image\/png/.test(dataUrl) ? "png" : "jpg"; }
function pbFit(w, h, maxW, maxH) { var s = Math.min(maxW / w, maxH / h, 1e9); return { w: Math.round(w * s), h: Math.round(h * s) }; }

function pbProvince(p) {
  p = pbTrim(p); if (!p) return "";
  return /province|district|arob|autonomous/i.test(p) ? p : p.replace(/\s*\(.*\)$/, "") + " Province";
}
function pbLocation(c) {
  return [c.village, c.llg, c.district, pbProvince(c.province)].map(pbTrim).filter(Boolean).join(", ");
}

/* Ordered list of the sections a profile will contain (only those with content). */
function pbSections(p) {
  var b = p.business || {}, c = p.contact || {};
  var s = [];
  s.push({ id: "snapshot", title: "Business at a Glance" });
  if (pbTrim(p.about)) s.push({ id: "about", title: "About Us" });
  if (pbTrim(p.vision) || pbTrim(p.mission) || pbLines(p.values).length) s.push({ id: "vmv", title: "Vision, Mission & Values" });
  if ((p.people || []).some(function (x) { return pbTrim(x.name); })) s.push({ id: "people", title: "Ownership & Management" });
  if ((p.services || []).some(function (x) { return pbTrim(x.name); }) || pbTrim(p.market)) s.push({ id: "services", title: "Products & Services" });
  if (pbTrim(p.achievements) || pbTrim(p.plans)) s.push({ id: "growth", title: "Achievements & Future Plans" });
  s.push({ id: "contact", title: "Location & Contact" });
  if ((p.photos || []).some(pbHasImg)) s.push({ id: "gallery", title: "Photo Gallery" });
  if ((p.certs || []).some(pbHasImg)) s.push({ id: "appendix", title: "Appendices" });
  return s;
}

function pbSnapshotRows(p) {
  var b = p.business || {}, c = p.contact || {};
  var rows = [
    ["Business name", b.name],
    ["Business type", PB_ENTITY[b.entity] || ""],
    ["Industry", b.industryLabel || ""],
    ["IPA registration no.", b.ipa],
    ["IRC TIN", b.tin],
    ["GST status", b.gst ? PB_GST[b.gst] : ""],
    ["Date registered", b.regDate ? pbDate(b.regDate) : ""],
    ["Operating since", b.year],
    ["Employees", b.employees],
    ["Location", pbLocation(c)]
  ];
  return rows.filter(function (r) { return pbTrim(r[1]); });
}
function pbContactRows(p) {
  var c = p.contact || {};
  return [
    ["Physical address", c.physical],
    ["Location", pbLocation(c)],
    ["Postal address", c.postal],
    ["Phone", c.phone],
    ["Email", c.email],
    ["Facebook / website", c.web]
  ].filter(function (r) { return pbTrim(r[1]); });
}
function pbDate(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); if (!m) return iso || "";
  var mon = ["January","February","March","April","May","June","July","August","September","October","November","December"][+m[2] - 1];
  return (+m[3]) + " " + mon + " " + m[1];
}
var PB_CREDIT = "Profile prepared with RDC Profile Builder · Ready Digital Consultancy, Kokopo · 70254566";

/* ===================== WORD (.docx) ===================== */
function pbBuildDocx(docx, p) {
  var D = docx, t = PB_THEMES[p.theme] || PB_THEMES.ocean;
  var b = p.business || {}, c = p.contact || {};
  var W = 9638; // content width in twips (A4, 2 cm margins)
  var noBorder = { style: D.BorderStyle.NONE, size: 0, color: "FFFFFF" };
  var noBorders = { top: noBorder, bottom: noBorder, left: noBorder, right: noBorder, insideHorizontal: noBorder, insideVertical: noBorder };
  var thin = { style: D.BorderStyle.SINGLE, size: 4, color: "D5D9DD" };
  var thinBorders = { top: thin, bottom: thin, left: thin, right: thin, insideHorizontal: thin, insideVertical: thin };

  function run(text, o) { o = o || {}; o.text = text; return new D.TextRun(o); }
  function para(text, o) { o = o || {}; return new D.Paragraph({ children: [run(text, o.run)], spacing: o.spacing || { after: 140, line: 300 }, alignment: o.alignment }); }
  function h1(text) { return new D.Paragraph({ heading: D.HeadingLevel.HEADING_1, children: [run(text)] }); }
  function h2(text, o) { o = o || {}; return new D.Paragraph({ heading: D.HeadingLevel.HEADING_2, children: [run(text)], pageBreakBefore: !!o.pageBreakBefore }); }
  function paras(text) { return pbLines(text).map(function (l) { return para(l); }); }
  function bullets(list) {
    return list.map(function (l) { return new D.Paragraph({ children: [run(l)], bullet: { level: 0 }, spacing: { after: 80 } }); });
  }
  function cell(children, o) {
    o = o || {};
    return new D.TableCell({
      children: children, width: { size: o.w, type: D.WidthType.DXA },
      shading: o.fill ? { fill: o.fill, type: D.ShadingType.CLEAR, color: "auto" } : undefined,
      margins: { top: 90, bottom: 90, left: 140, right: 140 }, verticalAlign: o.v || D.VerticalAlign.TOP
    });
  }
  function kvTable(rows) {
    var a = 3100, bw = W - a;
    return new D.Table({
      width: { size: W, type: D.WidthType.DXA }, columnWidths: [a, bw], borders: thinBorders,
      rows: rows.map(function (r) {
        return new D.TableRow({ children: [
          cell([para(r[0], { run: { bold: true, color: t.dark }, spacing: { after: 0 } })], { w: a, fill: t.light }),
          cell(pbLines(r[1]).map(function (l) { return para(l, { spacing: { after: 0 } }); }), { w: bw })
        ] });
      })
    });
  }
  function gridTable(head, rows, widths) {
    var hdr = new D.TableRow({ tableHeader: true, children: head.map(function (h, i) {
      return cell([para(h, { run: { bold: true, color: "FFFFFF" }, spacing: { after: 0 } })], { w: widths[i], fill: t.primary });
    }) });
    return new D.Table({
      width: { size: W, type: D.WidthType.DXA }, columnWidths: widths, borders: thinBorders,
      rows: [hdr].concat(rows.map(function (r, ri) {
        return new D.TableRow({ children: r.map(function (v, i) {
          var ls = pbLines(v); if (!ls.length) ls = [""];
          return cell(ls.map(function (l) { return para(l, { spacing: { after: 0 }, run: i === 0 ? { bold: true } : {} }); }), { w: widths[i], fill: ri % 2 ? t.light : undefined });
        }) });
      }))
    });
  }
  function img(i, maxW, maxH) {
    var f = pbFit(i.w, i.h, maxW, maxH);
    return new D.ImageRun({ data: pbB64ToBytes(i.data), type: pbImgType(i.data), transformation: { width: f.w, height: f.h } });
  }
  function spacer(after) { return new D.Paragraph({ children: [], spacing: { after: after || 200 } }); }

  /* ---- cover ---- */
  var year = new Date().getFullYear();
  var coverInner = [spacer(600)];
  if (pbHasImg(p.logo)) coverInner.push(new D.Paragraph({ children: [img(p.logo, 170, 170)], spacing: { after: 360 } }));
  coverInner.push(para("BUSINESS PROFILE", { run: { bold: true, color: t.accent, size: 24, characterSpacing: 60 }, spacing: { after: 200 } }));
  coverInner.push(para(pbTrim(b.name) || "Business name", { run: { bold: true, color: "FFFFFF", size: 64 }, spacing: { after: 200, line: 280 } }));
  if (pbTrim(b.tagline)) coverInner.push(para(b.tagline, { run: { color: "FFFFFF", size: 28, italics: true }, spacing: { after: 400 } }));
  var loc = pbLocation(c);
  if (loc) coverInner.push(para(loc, { run: { color: "FFFFFF", size: 22 }, spacing: { after: 80 } }));
  coverInner.push(para(String(year), { run: { color: t.accent, size: 22, bold: true }, spacing: { after: 600 } }));

  var coverBand = new D.Table({
    width: { size: W, type: D.WidthType.DXA }, columnWidths: [W], borders: noBorders,
    rows: [new D.TableRow({ height: { value: 9600, rule: D.HeightRule.ATLEAST }, children: [
      new D.TableCell({ children: coverInner, width: { size: W, type: D.WidthType.DXA },
        shading: { fill: t.primary, type: D.ShadingType.CLEAR, color: "auto" },
        margins: { top: 200, bottom: 200, left: 600, right: 600 } })
    ] })]
  });
  var coverFacts = [];
  if (pbTrim(b.ipa)) coverFacts.push("IPA Reg. " + pbTrim(b.ipa));
  if (pbTrim(b.tin)) coverFacts.push("TIN " + pbTrim(b.tin));
  var coverContact = [c.phone, c.email].map(pbTrim).filter(Boolean).join("   |   ");
  var cover = [coverBand, spacer(300)];
  if (coverFacts.length) cover.push(para(coverFacts.join("   |   "), { run: { bold: true, color: t.dark, size: 22 }, spacing: { after: 80 } }));
  if (coverContact) cover.push(para(coverContact, { run: { color: "4A5560", size: 22 }, spacing: { after: 80 } }));
  if (pbTrim(c.postal)) cover.push(para(c.postal, { run: { color: "4A5560", size: 22 } }));

  /* ---- body ---- */

<script>(function () {
"use strict";
var $ = function (s, r) { return (r || document).querySelector(s); };
var app = $("#app"), layer = $("#layer");
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function uid() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

/* ---------- settings (per-viewer convenience) ---------- */
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem("rdcpb." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem("rdcpb." + k, JSON.stringify(v)); } catch (e) {} }
};
var lang = LS.get("lang", "en");
function t(k) { return (T[lang] && T[lang][k]) || T.en[k] || k; }

/* ---------- profile store: IndexedDB, falling back to memory ---------- */
var Store = (function () {
  var mem = {}, dbp = null, persistent = false;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise(function (res) {
      try {
        var rq = indexedDB.open("rdc-profile-builder", 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore("profiles", { keyPath: "id" }); };
        rq.onsuccess = function () { persistent = true; res(rq.result); };
        rq.onerror = function () { res(null); };
        rq.onblocked = function () { res(null); };
      } catch (e) { res(null); }
    });
    return dbp;
  }
  function tx(mode, fn) {
    return open().then(function (db) {
      if (!db) return fn(null);
      return new Promise(function (res) {
        try {
          var x = db.transaction("profiles", mode), st = x.objectStore("profiles"), out = fn(st);
          x.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); };
          x.onerror = x.onabort = function () { res(fn(null)); };
        } catch (e) { res(fn(null)); }
      });
    });
  }
  return {
    isPersistent: function () { return open().then(function () { return persistent; }); },
    all: function () {
      return tx("readonly", function (st) { if (!st) return Object.keys(mem).map(function (k) { return mem[k]; }); return st.getAll(); })
        .then(function (r) { return (r || []).sort(function (a, b) { return (b.updated || 0) - (a.updated || 0); }); });
    },
    get: function (id) { return tx("readonly", function (st) { return st ? st.get(id) : mem[id]; }); },
    put: function (p) { mem[p.id] = p; return tx("readwrite", function (st) { if (st) st.put(p); return true; }); },
    del: function (id) { delete mem[id]; return tx("readwrite", function (st) { if (st) st.delete(id); return true; }); },
    clear: function () { mem = {}; return tx("readwrite", function (st) { if (st) st.clear(); return true; }); }
  };
})();

/* ---------- downloads: artifact viewer capability, else a normal browser download ---------- */
var dl = null;
try { if (window.claude && window.claude.use) window.claude.use("downloads").then(function (d) { dl = d; }, function () {}); } catch (e) {}
function saveFile(filename, blob) {
  if (dl) return dl.save({ filename: filename, data: blob }).then(function () { return "saved"; }, function (e) {
    if (e && e.code === "declined") return "declined"; throw e;
  });
  return new Promise(function (res) {
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); res("saved"); }, 800);
  });
}

/* ---------- document libraries load on first export ---------- */
var libWait = {};
var LIB_GLOBAL = { docx: "docx", jspdf: "jspdf", pdf: "pdfjsLib", pdfworker: "pdfjsWorker" };
function loadLib(name) {
  var g = LIB_GLOBAL[name];
  if (window[g]) return Promise.resolve();
  if (libWait[name]) return libWait[name];
  libWait[name] = new Promise(function (res, rej) {
    var s = document.createElement("script"); s.src = LIB_URLS[name]; s.async = true;
    s.onload = function () { window[g] ? res() : rej(new Error("lib")); };
    s.onerror = function () { libWait[name] = null; s.remove(); rej(new Error("lib")); };
    document.head.appendChild(s);
  });
  return libWait[name];
}

/* ---------- PDF certificates: each page becomes a flat image, made on the device ----------
   The worker script is loaded first so pdf.js runs on the main thread (no separate worker file needed). */
var PDF_MAX_BYTES = 15 * 1024 * 1024;
function isPdf(f) { return f && (f.type === "application/pdf" || /\.pdf$/i.test(f.name || "")); }
function readPdf(file, maxPages, maxDim) {
  if (file.size > PDF_MAX_BYTES) return Promise.reject(new Error("big"));
  return loadLib("pdfworker").then(function () { return loadLib("pdf"); }).then(function () {
    return file.arrayBuffer();
  }).then(function (buf) {
    return window.pdfjsLib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false, enableXfa: false }).promise;
  }).then(function (pdf) {
    var n = Math.min(pdf.numPages, maxPages), out = [], chain = Promise.resolve();
    for (var i = 1; i <= n; i++) (function (num) {
      chain = chain.then(function () { return pdf.getPage(num); }).then(function (page) {
        var v1 = page.getViewport({ scale: 1 });
        var vp = page.getViewport({ scale: Math.min(4, maxDim / Math.max(v1.width, v1.height)) });
        var cv = document.createElement("canvas"); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
        var cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height);
        return page.render({ canvasContext: cx, viewport: vp }).promise.then(function () {
          out.push({ data: cv.toDataURL("image/jpeg", 0.85), w: cv.width, h: cv.height, page: num, pages: pdf.numPages });
          page.cleanup(); cv.width = cv.height = 0;
        });
      });
    })(i);
    return chain.then(function () { pdf.destroy(); return out; });
  });
}
function nameToCaption(name) {
  return String(name || "").replace(/\.[a-z0-9]+$/i, "").replace(/[_\-]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 80);
}

/* ---------- toast + dialog ---------- */
var toastTimer;
function toast(msg) {
  var el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 3200);
}

  var f = $(".dialog button", layer); if (f) f.focus();

/* ---------- profile helpers ---------- */
function blank() {
  return { id: uid(), created: Date.now(), updated: Date.now(), theme: "ocean", industry: "", business: { name: "" }, contact: { province: "" },
    about: "", vision: "", mission: "", values: "", people: [{ name: "", role: "Owner", phone: "", bio: "" }],
    services: [{ name: "", desc: "" }], market: "", achievements: "", plans: "", photos: [], certs: [], logo: null };
}
function getPath(o, path) { return path.split(".").reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
function setPath(o, path, v) { var ks = path.split("."), last = ks.pop(), cur = o; ks.forEach(function (k) { if (cur[k] == null) cur[k] = {}; cur = cur[k]; }); cur[last] = v; }
function filled(v) { return String(v == null ? "" : v).trim() !== ""; }

function checks(p) {
  var b = p.business || {}, c = p.contact || {};
  return [
    { k: "m_name", ok: filled(b.name), step: 0 },
    { k: "m_entity", ok: filled(b.entity), step: 0 },
    { k: "m_ipa", ok: filled(b.ipa), step: 1 },
    { k: "m_tin", ok: filled(b.tin), step: 1 },
    { k: "m_contact", ok: filled(c.phone) || filled(c.email), step: 2 },
    { k: "m_about", ok: filled(p.about), step: 3 },
    { k: "m_vm", ok: filled(p.vision) || filled(p.mission), step: 3 },
    { k: "m_people", ok: (p.people || []).some(function (x) { return filled(x.name); }), step: 4 },
    { k: "m_services", ok: (p.services || []).some(function (x) { return filled(x.name); }), step: 5 },
    { k: "m_logo", ok: !!(p.logo && p.logo.data), step: 7 },
    { k: "m_photos", ok: (p.photos || []).length > 0, step: 7 },
    { k: "m_certs", ok: (p.certs || []).length > 0, step: 7 }
  ];
}
function pct(p) { var c = checks(p); return Math.round(100 * c.filter(function (x) { return x.ok; }).length / c.length); }
function place(p) {
  var c = p.contact || {};
  var town = [c.village, c.district].filter(filled)[0];
  var prov = filled(c.province) ? pbProvince(c.province) : "Papua New Guinea";
  return { place: town ? town + ", " + prov : prov, province: prov };
}
function fillTpl(s, p) {
  var pl = place(p), b = p.business || {};
  return s.replace(/\{name\}/g, filled(b.name) ? b.name.trim() : "Our business").replace(/\{place\}/g, pl.place)
    .replace(/\{province\}/g, pl.province).replace(/\{year\}/g, filled(b.year) ? b.year.trim() : "the day we opened");
}
function industryName(k) { var i = INDUSTRIES[k]; return i ? i[lang] || i.en : ""; }
function slug(s) { return (String(s || "Business").trim().replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "") || "Business").slice(0, 60); }

/* ---------- image intake: shrink on the device before storing ---------- */
function readImage(file, maxDim, keepPng) {
  return new Promise(function (res, rej) {
    if (!file || !/^image\//.test(file.type)) return rej(new Error("type"));
    var fr = new FileReader();
    fr.onerror = function () { rej(new Error("read")); };
    fr.onload = function () {
      var im = new Image();
      im.onerror = function () { rej(new Error("decode")); };
      im.onload = function () {
        var s = Math.min(1, maxDim / Math.max(im.naturalWidth, im.naturalHeight));
        var w = Math.max(1, Math.round(im.naturalWidth * s)), h = Math.max(1, Math.round(im.naturalHeight * s));
        var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        var cx = cv.getContext("2d");
        if (!keepPng) { cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h); }
        cx.drawImage(im, 0, 0, w, h);
        res({ data: keepPng ? cv.toDataURL("image/png") : cv.toDataURL("image/jpeg", 0.82), w: w, h: h });
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- state ---------- */

function touch() {

}

}
function plus() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'; }
function openProfile(id) { Store.get(id).then(function (p) { if (!p) return; cur = p; stepIx = 0; renderEditor(); }); }
function importFile(e) {
  var f = e.target.files && e.target.files[0]; if (!f) return;
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var p = JSON.parse(fr.result); if (p && p.rdcProfileBuilder && p.profile) p = p.profile;
      if (!p || typeof p !== "object" || !p.business) throw new Error("bad");
      var base = blank(); Object.keys(base).forEach(function (k) { if (p[k] === undefined) p[k] = base[k]; });
      p.id = uid(); p.updated = Date.now(); delete p.example;
      Store.put(p).then(function () { toast(t("imported")); cur = p; stepIx = 0; renderEditor(); });
    } catch (err) { toast(t("importFail")); }

/* ---------- editor ---------- */
var STEPS = ["basics", "reg", "contact", "story", "people", "services", "growth", "media", "export"];
function stepDone(i) {
  var c = checks(cur);
  var map = { 0: ["m_name", "m_entity"], 1: ["m_ipa", "m_tin"], 2: ["m_contact"], 3: ["m_about", "m_vm"], 4: ["m_people"], 5: ["m_services"], 6: [], 7: ["m_logo", "m_photos"], 8: [] };
  if (i === 6) return filled(cur.achievements) || filled(cur.plans);
  if (i === 8) return false;
  return map[i].every(function (k) { return c.filter(function (x) { return x.k === k; })[0].ok; });
}
function renderEditor() {
  var s = STEPS[stepIx];

    return '<button type="button" class="step' + (stepDone(i) ? " done" : "") + '" data-step="' + i + '"' + (i === stepIx ? ' aria-current="step"' : "") + '>' +
      '<span class="n">' + (stepDone(i) ? "✓" : i + 1) + '</span>' + esc(t("s_" + id)) + '</button>';
  }).join("") + '</div></nav>';
  var nm = filled(cur.business.name) ? cur.business.name : t("untitled");
  var body = '<section class="wrap sheet" id="sheet"><p class="bizname">' + esc(nm) + '</p><h2>' + esc(t("h_" + s)) + '</h2>' + RENDER[s]() + '</section>';
  var nav = '<div class="navbar"><div class="wrap">' +
    (stepIx > 0 ? '<button class="btn" type="button" id="prevB">' + esc(t("back")) + '</button>' : '<button class="btn" type="button" id="allB">' + esc(t("allProfiles")) + '</button>') +
    '<span class="status" id="status" aria-live="polite"></span>' +
    (stepIx < STEPS.length - 1 ? '<button class="btn primary" type="button" id="nextB">' + esc(t("next")) + '</button>' : '<button class="btn" type="button" id="allB2">' + esc(t("allProfiles")) + '</button>') +
    '</div></div>';
  app.innerHTML = rail + body + nav;
  status();
  var act = $(".step[aria-current]"); if (act) act.scrollIntoView({ block: "nearest", inline: "center" });
  app.querySelectorAll("[data-step]").forEach(function (b) { b.onclick = function () { go(+b.dataset.step); }; });
  var pv = $("#prevB"); if (pv) pv.onclick = function () { go(stepIx - 1); };
  var nx = $("#nextB"); if (nx) nx.onclick = function () { go(stepIx + 1); };
  ["#allB", "#allB2"].forEach(function (id) { var b = $(id); if (b) b.onclick = function () { flush().then(function () { cur = null; renderHome(); }); }; });
  bindFields();
  (WIRE[s] || function () {})();
}
function go(i) { stepIx = Math.max(0, Math.min(STEPS.length - 1, i)); renderEditor(); window.scrollTo(0, 0); }
function refreshRail() {
  app.querySelectorAll("[data-step]").forEach(function (b, i) {
    var d = stepDone(i); b.classList.toggle("done", d); $(".n", b).textContent = d ? "✓" : i + 1;

}

/* generic field markup; values bound by data-path */
function fld(path, labelKey, o) {
  o = o || {}; var v = getPath(cur, path); v = v == null ? "" : v;
  var id = "f_" + path.replace(/\./g, "_"), ctl;
  if (o.type === "select") {
    ctl = '<select id="' + id + '" data-path="' + path + '"><option value="">' + esc(t("choose")) + '</option>' +
      o.options.map(function (op) { return '<option value="' + esc(op[0]) + '"' + (String(v) === op[0] ? " selected" : "") + '>' + esc(op[1]) + '</option>'; }).join("") + '</select>';
  } else if (o.type === "textarea") {
    ctl = '<textarea id="' + id + '" data-path="' + path + '"' + (o.tall ? ' class="tall"' : "") + '>' + esc(v) + '</textarea>';
  } else {
    ctl = '<input id="' + id + '" type="' + (o.type || "text") + '" data-path="' + path + '" value="' + esc(v) + '"' +
      (o.inputmode ? ' inputmode="' + o.inputmode + '"' : "") + ' autocomplete="off">';
  }
  return '<div class="field' + (o.full ? " full" : "") + '"><label for="' + id + '">' + esc(t(labelKey)) + (o.req ? '<em>' + esc(t("req")) + '</em>' : "") + '</label>' + ctl +
    (o.hint ? '<span class="hint">' + esc(t(o.hint)) + '</span>' : "") + '</div>';
}
function bindFields() {
  app.querySelectorAll("[data-path]").forEach(function (el) {
    var ev = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(ev, function () {
      setPath(cur, el.dataset.path, el.value);
      if (el.dataset.path === "industry") {
        var ind = INDUSTRIES[el.value];
        if (ind && !filled(cur.business.industryLabel)) { cur.business.industryLabel = ind.en; var il = $("#f_business_industryLabel"); if (il) il.value = ind.en; }
      }
      if (el.dataset.path === "business.name") { var bn = $(".bizname"); if (bn) bn.textContent = filled(el.value) ? el.value : t("untitled"); }
      touch(); refreshRail();
    });
  });
}

var RENDER = {

      fld("contact.postal", "f_postal", { full: true }) + fld("contact.phone", "f_phone", { type: "tel" }) +
      fld("contact.email", "f_email", { type: "email" }) + fld("contact.web", "f_web", { full: true, hint: "hint_web" }) + '</div>';
  },
  story: function () {
    return '<div class="exbtns" style="margin:0 0 16px"><button class="btn" type="button" id="starterB">' + esc(t("starter")) + '</button></div><div id="starterMsg"></div>' +
      '<div class="grid">' + fld("about", "f_about", { type: "textarea", tall: true, full: true, hint: "hint_about" }) +
      fld("vision", "f_vision", { type: "textarea", full: true }) + fld("mission", "f_mission", { type: "textarea", full: true }) +
      fld("values", "f_values", { type: "textarea", full: true, hint: "hint_values" }) + '</div>';
  },
  people: function () {
    return '<p class="sub">' + esc(t("hint_people")) + '</p><div class="repeat" id="rep">' + (cur.people || []).map(function (x, i) {
      return '<div class="item"><div class="ihead"><b>' + (i + 1) + '</b>' + ((cur.people.length > 1) ? '<button class="linkbtn" type="button" data-rm="' + i + '">' + esc(t("remove")) + '</button>' : "") + '</div><div class="grid">' +
        fld("people." + i + ".name", "f_pname") + fld("people." + i + ".role", "f_prole") + fld("people." + i + ".phone", "f_pphone", { type: "tel" }) +
        fld("people." + i + ".bio", "f_pbio", { type: "textarea", full: true }) + '</div></div>';
    }).join("") + '</div><div class="exbtns"><button class="btn" type="button" id="addB">' + plus() + esc(t("addPerson")) + '</button></div>';
  },
  services: function () {
    return '<div class="repeat" id="rep">' + (cur.services || []).map(function (x, i) {
      return '<div class="item"><div class="ihead"><b>' + (i + 1) + '</b>' + ((cur.services.length > 1) ? '<button class="linkbtn" type="button" data-rm="' + i + '">' + esc(t("remove")) + '</button>' : "") + '</div><div class="grid">' +
        fld("services." + i + ".name", "f_sname", { full: true }) + fld("services." + i + ".desc", "f_sdesc", { type: "textarea", full: true }) + '</div></div>';
    }).join("") + '</div><div class="exbtns"><button class="btn" type="button" id="addB">' + plus() + esc(t("addService")) + '</button></div>' +
      '<div class="grid" style="margin-top:22px">' + fld("market", "f_market", { type: "textarea", full: true }) + '</div>';
  },
  growth: function () {

  },
  media: function () {
    var logo = cur.logo && cur.logo.data;
    return '<h3 class="section-title">' + esc(t("logo")) + '</h3><div class="logo-row"><div class="logo-box">' + (logo ? '<img alt="" src="' + cur.logo.data + '">' : "PNG / JPG") + '</div>' +
      '<label class="btn filebtn">' + esc(t(logo ? "changeLogo" : "addLogo")) + '<input type="file" accept="image/*" id="logoIn"></label>' +
      (logo ? '<button class="linkbtn" type="button" id="logoRm">' + esc(t("remove")) + '</button>' : "") + '</div>' +
      '<h3 class="section-title">' + esc(t("photos")) + '</h3><p class="small">' + esc(t("hint_photos")) + '</p>' + tiles("photos", 8) +
      '<h3 class="section-title">' + esc(t("certs")) + '</h3><p class="small">' + esc(t("hint_certs")) + '</p>' + tiles("certs", 6);
  },
  export: function () {
    var c = checks(cur), miss = c.filter(function (x) { return !x.ok; });
    var th = Object.keys(PB_THEMES).map(function (k) { var x = PB_THEMES[k];
      return '<button type="button" class="theme" data-theme-k="' + k + '" aria-pressed="' + (cur.theme === k) + '"><span class="swatch"><i style="background:#' + x.primary + '"></i><i style="background:#' + x.accent + '"></i></span>' + esc(x.name) + '</button>'; }).join("");
    return '<h3 class="section-title" style="margin-top:6px">' + esc(t("theme")) + '</h3><div class="themes">' + th + '</div>' +
      '<h3 class="section-title">' + esc(t("checklist")) + '</h3>' +
      (miss.length ? "" : '<div class="notice good">' + esc(t("allGood")) + '</div>') +
      '<ul class="check">' + c.map(function (x) {
        return '<li class="' + (x.ok ? "" : "miss") + '"><span class="dot" aria-hidden="true">' + (x.ok ? "✓" : "") + '</span>' +
          (x.ok ? esc(t(x.k)) : '<button type="button" data-goto="' + x.step + '">' + esc(t(x.k)) + '</button>') + '</li>'; }).join("") + '</ul>' +
      '<div class="exbtns" style="margin-top:20px"><button class="btn primary" type="button" id="exWord">' + esc(t("exportWord")) + '</button>' +
      '<button class="btn primary" type="button" id="exPdf">' + esc(t("exportPdf")) + '</button></div>' +
      '<div class="exbtns"><button class="btn" type="button" id="exJson">' + esc(t("backup")) + '</button></div><p class="small">' + esc(t("backupHint")) + '</p>' +
      '<h3 class="section-title">' + esc(t("preview")) + '</h3><p class="small">' + esc(t("previewNote")) + '</p><div class="preview" id="pv">' + previewHtml() + '</div>';

function tiles(kind, max) {

  return '<div class="media-grid">' + list.map(function (x, i) {

var WIRE = {
  story: function () {
    $("#starterB").onclick = function () {
      var ind = INDUSTRIES[cur.industry], msg = $("#starterMsg");
      if (!ind) { msg.innerHTML = '<div class="notice">' + esc(t("starterIndustry")) + '</div>'; return; }
      var changed = false;
      ["about", "vision", "mission", "values", "market"].forEach(function (k) { if (!filled(cur[k])) { cur[k] = fillTpl(ind[k], cur); changed = true; } });
      var emptySv = (cur.services || []).every(function (x) { return !filled(x.name) && !filled(x.desc); });
      if (emptySv) { cur.services = ind.services.map(function (s) { return { name: s[0], desc: s[1] }; }); changed = true; }
      if (changed) { touch(); renderEditor(); $("#starterMsg").innerHTML = '<div class="notice good">' + esc(t("starterDone")) + '</div>'; }
      else msg.innerHTML = '<div class="notice">' + esc(t("starterNone")) + '</div>';
    };
  },
  people: function () { wireRepeat("people", { name: "", role: "", phone: "", bio: "" }); },
  services: function () { wireRepeat("services", { name: "", desc: "" }); },
  media: function () {
    $("#logoIn").onchange = function (e) {
      var f = e.target.files[0]; if (!f) return; toast(t("imgWorking"));
      readImage(f, 800, true).then(function (img) { var tt = $(".toast"); if (tt) tt.hidden = true; cur.logo = img; touch(); renderEditor(); }, function () { toast(t("imgError")); });
    };
    var lr = $("#logoRm"); if (lr) lr.onclick = function () { cur.logo = null; touch(); renderEditor(); };
    app.querySelectorAll("[data-add]").forEach(function (inp) {
      inp.onchange = function (e) {
        var kind = inp.dataset.add, max = kind === "photos" ? 8 : 6, files = Array.prototype.slice.call(e.target.files || []);
        files = files.slice(0, Math.max(0, max - cur[kind].length)); if (!files.length) return;
        toast(t(files.some(isPdf) ? "pdfWorking" : "imgWorking"));
        files.reduce(function (pr, f) {
          return pr.then(function () {
            var room = max - cur[kind].length; if (room <= 0) return;
            if (kind === "certs" && isPdf(f)) {
              return readPdf(f, room, 1800).then(function (pages) {
                var base = nameToCaption(f.name);
                pages.forEach(function (img) {
                  img.caption = img.pages > 1 ? base + " (page " + img.page + ")" : base;
                  delete img.page; delete img.pages; cur.certs.push(img);
                });
              }, function (err) {
                toast(t(err && err.name === "PasswordException" ? "pdfLocked" : err && err.message === "big" ? "pdfBig" : err && err.message === "lib" ? "pdfLib" : "pdfError"));
              });
            }
            return readImage(f, kind === "certs" ? 1800 : 1400, false).then(function (img) {
              img.caption = kind === "certs" ? nameToCaption(f.name) : ""; cur[kind].push(img);
            }, function () { toast(t("imgError")); });
          });
        }, Promise.resolve()).then(function () { touch(); renderEditor(); });
      };
    });
    app.querySelectorAll("[data-cap]").forEach(function (inp) {
      inp.oninput = function () { cur[inp.dataset.cap][+inp.dataset.i].caption = inp.value; touch(); };
    });
    app.querySelectorAll("[data-rmimg]").forEach(function (b) {
      b.onclick = function () { cur[b.dataset.rmimg].splice(+b.dataset.i, 1); touch(); renderEditor(); };
    });
  },
  export: function () {
    loadLib("docx").catch(function () {}); loadLib("jspdf").catch(function () {});
    app.querySelectorAll("[data-theme-k]").forEach(function (b) {
      b.onclick = function () { cur.theme = b.dataset.themeK; touch();
        app.querySelectorAll("[data-theme-k]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
        $("#pv").innerHTML = previewHtml(); };
    });
    app.querySelectorAll("[data-goto]").forEach(function (b) { b.onclick = function () { go(+b.dataset.goto); }; });
    $("#exWord").onclick = function () { doExport("docx", this); };
    $("#exPdf").onclick = function () { doExport("pdf", this); };
    $("#exJson").onclick = function () {
      var data = JSON.stringify({ rdcProfileBuilder: 1, profile: cur });
      saveFile(slug(cur.business.name) + "_profile.json", new Blob([data], { type: "application/json" })).then(function (r) {
        toast(r === "declined" ? t("declined") : t("exported")); }, function () { toast(t("exportFail")); });
    };
  }
};
function wireRepeat(key, empty) {
  $("#addB").onclick = function () { cur[key].push(clone(empty)); touch(); renderEditor();
    var items = app.querySelectorAll(".item"); var last = items[items.length - 1]; if (last) { last.scrollIntoView({ block: "center" }); var i = $("input", last); if (i) i.focus(); } };
  app.querySelectorAll("[data-rm]").forEach(function (b) { b.onclick = function () { cur[key].splice(+b.dataset.rm, 1); touch(); renderEditor(); }; });
}

function doExport(kind, btn) {
  var label = btn.textContent; btn.disabled = true; btn.textContent = t("building");
  var name = slug(cur.business.name) + "_Business_Profile." + kind;
  flush().then(function () { return loadLib(kind === "docx" ? "docx" : "jspdf"); }).then(function () {
    if (kind === "docx") return window.docx.Packer.toBlob(pbBuildDocx(window.docx, cur));
    return pbBuildPdf(window.jspdf.jsPDF, cur).output("blob");
  }).then(function (blob) { return saveFile(name, blob); })
    .then(function (r) { toast(r === "declined" ? t("declined") : t("exported")); }, function (e) { console.error(e); toast(t("exportFail")); })
    .then(function () { btn.disabled = false; btn.textContent = label; });
}

function previewHtml() {
  var th = PB_THEMES[cur.theme] || PB_THEMES.ocean, b = cur.business || {}, c = cur.contact || {};
  var P = "#" + th.primary, A = "#" + th.accent;
  var loc = pbLocation(c);
  var facts = [filled(b.ipa) ? "IPA Reg. " + b.ipa : "", filled(b.tin) ? "TIN " + b.tin : ""].filter(Boolean).join("  |  ");
  var cover = '<div class="paper cover" aria-label="Cover page preview"><div class="band" style="background:' + P + ';border-bottom:4px solid ' + A + '">' +
    (cur.logo && cur.logo.data ? '<div class="lg"><img alt="" src="' + cur.logo.data + '"></div>' : "") +
    '<div class="kick" style="color:' + A + '">BUSINESS PROFILE</div><div class="nm">' + esc(filled(b.name) ? b.name : t("untitled")) + '</div>' +
    (filled(b.tagline) ? '<div class="tg">' + esc(b.tagline) + '</div>' : "") + (loc ? '<div style="margin-top:6px">' + esc(loc) + '</div>' : "") + '</div>' +
    '<div class="low">' + (facts ? '<b>' + esc(facts) + '</b><br>' : "") + esc([c.phone, c.email].filter(filled).join("  |  ")) + '</div></div>';
  var rows = pbSnapshotRows(cur).slice(0, 8).map(function (r) { return '<tr><td style="background:#' + th.light + ';color:#' + th.dark + '">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join("");
  var about = String(cur.about || "").split(/\n+/).filter(filled).slice(0, 2).map(function (x) { return '<p>' + esc(x) + '</p>'; }).join("");
  var page = '<div class="paper page" aria-label="First page preview"><h4 style="color:' + P + ';border-color:' + A + '">Business at a Glance</h4><table>' + rows + '</table>' +
    (about ? '<h4 style="color:' + P + ';border-color:' + A + '">About Us</h4>' + about : "") +
    '<div class="pf" style="border-color:' + A + '"><span>' + esc(b.name || "") + ' — Business Profile</span><span>Page 2</span></div></div>';
  return cover + page;
}

/* ---------- boot ---------- */
chrome();
(function boot() {
  if (!LS.get("seeded", false)) {
    LS.set("seeded", true);
    var ex = clone(SAMPLE_PROFILE); ex.updated = Date.now();
    Store.put(ex).then(renderHome);
  } else renderHome();
})();
window.addEventListener("pagehide", function () { flush(); });
document.addEventListener("visibilitychange", function () { if (document.hidden) flush(); });
})();
